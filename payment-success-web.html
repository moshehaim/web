<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שכונה – התשלום הושלם</title>
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rubik', -apple-system, sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            padding: 48px 32px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: riseIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Success icon */
        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ADE80, #22C55E);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(34,197,94,0.35);
            animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to   { transform: scale(1); }
        }

        .icon-wrap svg {
            width: 36px;
            height: 36px;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.4s ease 0.7s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .order-id {
            display: inline-block;
            font-size: 12px;
            color: #9CA3AF;
            background: #F3F4F6;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 32px;
            letter-spacing: 0.3px;
        }

        .order-id span {
            color: #2563EB;
            font-weight: 600;
        }

        .receipt-note {
            font-size: 13px;
            color: #6B7280;
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Rubik', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.98); }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #F3F4F6;
        }
        .footer-links a {
            font-size: 12px;
            color: #9CA3AF;
            text-decoration: none;
        }
        .footer-links a:hover { color: #2563EB; }
    </style>
</head>
<body>
<div class="card">

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
            <path d="M5 12.5 L10 17.5 L19 7"/>
        </svg>
    </div>

    <h1>התשלום התקבל!</h1>
    <p class="subtitle">הרכישה בוצעה בהצלחה.<br>הקבלה נשלחה לכתובת המייל שלך.</p>

    <div class="order-id" id="orderIdWrap" style="display:none">
        מספר הזמנה: <span id="orderIdText"></span>
    </div>

    <div class="receipt-note">
        ✓ המנוי / החבילה יופעלו תוך מספר דקות באפליקציה
    </div>

    <a href="account.html" class="btn-primary">חזרה לחשבון</a>

    <div class="footer-links">
        <a href="/">עמוד הבית</a>
        <a href="mailto:info@shchuna.co.il">יצירת קשר</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
        document.getElementById('orderIdText').textContent = orderId;
        document.getElementById('orderIdWrap').style.display = 'inline-block';
    }
</script>
<script>
/* רכישה מהאתר (ניהול העסק, js/manage-buy.js): הדף נפתח אחרי דף הסליקה. אם הגיעו מהאתר (sessionStorage 'shchuna.pay'):
 * בודקים את סטטוס התשלום בטבלת payments (RLS: רק התשלומים של המשתמש) — payment-callback בשרת מעדכן אותו —
 * ומחזירים לניהול המבצעים של העסק. בלי הסימון (האפליקציה בגרסת הדפדפן) — הדף נשאר כמו שהיה. */
(function () {
  var info = null;
  try { info = JSON.parse(sessionStorage.getItem('shchuna.pay') || 'null'); } catch (e) {}
  if (!info || !info.b || Date.now() - (info.t || 0) > 3 * 3600e3) return;
  var SB = { url: 'https://mebomrqnfnbqijiuawdh.supabase.co', key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYm9tcnFuZm5icWlqaXVhd2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkxOTc3MDEsImV4cCI6MjA1NDc3MzcwMX0.OSpzG4pnsgIiOEefWK0Z29ZHOo12bIhp0QXTdk2Hsg4' };
  var h1 = document.querySelector('h1'), sub = document.querySelector('.subtitle'), note = document.querySelector('.receipt-note'),
      icon = document.querySelector('.icon-wrap'), btn = document.querySelector('.btn-primary');
  btn.href = '/my-business/?id=' + encodeURIComponent(info.b) + '&open=promos';
  btn.textContent = 'חזרה לניהול העסק';
  var tok = null;
  try { var s = JSON.parse(localStorage.getItem('sb-mebomrqnfnbqijiuawdh-auth-token') || 'null'); tok = s && (s.access_token || (s.currentSession && s.currentSession.access_token)); } catch (e) {}
  if (!orderId || !tok) return;
  h1.textContent = 'בודקים את התשלום…'; sub.innerHTML = 'זה לוקח כמה שניות.'; note.style.display = 'none'; icon.style.visibility = 'hidden';
  var tries = 0;
  function done(st) {
    icon.style.visibility = '';
    if (st === 'completed') {
      try { sessionStorage.removeItem('shchuna.pay'); } catch (e) {}
      h1.textContent = 'התשלום התקבל!'; sub.innerHTML = 'הרכישה בוצעה בהצלחה.<br>הקבלה נשלחה לכתובת המייל שלך.';
      note.textContent = '✓ המנוי / החבילה פעילים — אפשר לפרסם מבצע'; note.style.display = '';
    } else if (st === 'failed') {
      icon.style.background = 'linear-gradient(135deg,#F87171,#DC2626)'; icon.style.boxShadow = '0 8px 24px rgba(220,38,38,.3)';
      icon.querySelector('svg').innerHTML = '<path d="M7 7 L17 17 M17 7 L7 17"/>';
      h1.textContent = 'התשלום לא הושלם'; sub.innerHTML = 'לא בוצע חיוב. אפשר לנסות שוב ממסך ניהול העסק.';
    } else {
      h1.textContent = 'התשלום בעיבוד'; sub.innerHTML = 'המנוי / החבילה יופעלו תוך מספר דקות.<br>הקבלה תישלח לכתובת המייל שלך.';
    }
  }
  function poll() {
    fetch(SB.url + '/rest/v1/payments?select=status&order_id=eq.' + encodeURIComponent(orderId), { headers: { apikey: SB.key, Authorization: 'Bearer ' + tok } })
      .then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
        var st = rows && rows[0] && rows[0].status;
        if (st === 'completed' || st === 'failed') return done(st);
        if (++tries >= 15) return done('pending');
        setTimeout(poll, 2000);
      }, function () { if (++tries >= 15) return done('pending'); setTimeout(poll, 2000); });
  }
  poll();
})();
</script>
</body>
</html>
