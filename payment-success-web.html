<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>שכונה – התשלום הושלם</title>
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Rubik', -apple-system, sans-serif;
            background: #F8FAFC;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08), 0 2px 8px rgba(0,0,0,0.04);
            padding: 48px 32px 36px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            animation: riseIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;
        }

        @keyframes riseIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Success icon */
        .icon-wrap {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4ADE80, #22C55E);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            box-shadow: 0 8px 24px rgba(34,197,94,0.35);
            animation: popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.3s both;
        }

        @keyframes popIn {
            from { transform: scale(0); }
            to   { transform: scale(1); }
        }

        .icon-wrap svg {
            width: 36px;
            height: 36px;
            stroke: white;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 50;
            stroke-dashoffset: 50;
            animation: drawCheck 0.4s ease 0.7s forwards;
        }

        @keyframes drawCheck {
            to { stroke-dashoffset: 0; }
        }

        h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1F2937;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 15px;
            color: #6B7280;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .order-id {
            display: inline-block;
            font-size: 12px;
            color: #9CA3AF;
            background: #F3F4F6;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 32px;
            letter-spacing: 0.3px;
        }

        .order-id span {
            color: #2563EB;
            font-weight: 600;
        }

        .receipt-note {
            font-size: 13px;
            color: #6B7280;
            background: #F0FDF4;
            border: 1px solid #BBF7D0;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .btn-primary {
            display: block;
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3B82F6, #1D4ED8);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Rubik', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: opacity 0.2s, transform 0.1s;
        }
        .btn-primary:hover { opacity: 0.9; }
        .btn-primary:active { transform: scale(0.98); }

        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #F3F4F6;
        }
        .footer-links a {
            font-size: 12px;
            color: #9CA3AF;
            text-decoration: none;
        }
        .footer-links a:hover { color: #2563EB; }
    </style>
</head>
<body>
<div class="card">

    <div class="icon-wrap">
        <svg viewBox="0 0 24 24">
            <path d="M5 12.5 L10 17.5 L19 7"/>
        </svg>
    </div>

    <h1>התשלום התקבל!</h1>
    <p class="subtitle">הרכישה בוצעה בהצלחה.<br>הקבלה נשלחה לכתובת המייל שלך.</p>

    <div class="order-id" id="orderIdWrap" style="display:none">
        מספר הזמנה: <span id="orderIdText"></span>
    </div>

    <div class="receipt-note">
        ✓ המנוי / החבילה יופעלו תוך מספר דקות באפליקציה
    </div>

    <a href="account.html" class="btn-primary">חזרה לחשבון</a>

    <div class="footer-links">
        <a href="/">עמוד הבית</a>
        <a href="mailto:info@shchuna.co.il">יצירת קשר</a>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
        document.getElementById('orderIdText').textContent = orderId;
        document.getElementById('orderIdWrap').style.display = 'inline-block';
    }
</script>
</body>
</html>
