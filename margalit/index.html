<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>מרגלית קינוחים — שכונה</title>
<link rel="icon" href="/app_icon.png">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;color:#0b3a78;background:#f6faff}
  .w{text-align:center;font-weight:600} img{width:64px;height:64px;border-radius:16px} a{color:#0b3a78}
</style>
</head>
<body>
<div class="w"><img src="/app_icon.png" alt="שכונה"><p>מעבירים אותך למרגלית קינוחים…</p><p><a href="/givat-zeev/biz/%D7%9E%D7%A8%D7%92%D7%9C%D7%99%D7%AA-%D7%A7%D7%99%D7%A0%D7%95%D7%97%D7%99%D7%9D/">לחצו כאן אם לא עברתם</a></p></div>
<script>
(function () {
  var CODE = "margalit";                 // ← מרגלית קינוחים (קישור עסק → כרטיס באתר)
  var CARD = "/givat-zeev/biz/%D7%9E%D7%A8%D7%92%D7%9C%D7%99%D7%AA-%D7%A7%D7%99%D7%A0%D7%95%D7%97%D7%99%D7%9D/";
  var SCAN_URL = "https://mebomrqnfnbqijiuawdh.supabase.co/functions/v1/scan";
  var ua = navigator.userAgent || "";
  var isTest = /[?&]t=1/.test(location.search);
  var platform = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : (/Android/i.test(ua) ? "android" : "other");
  var done = false;
  function go() { if (done) return; done = true; location.replace(CARD); }
  var px = new Image();
  px.onload = go; px.onerror = go; setTimeout(go, 1200);
  px.src = SCAN_URL + "?s=" + encodeURIComponent(CODE) + "&p=" + encodeURIComponent(platform) + (isTest ? "&t=1" : "") + "&r=" + Date.now();
})();
</script>
</body>
</html>
