<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שכונה - כניסה</title>
    <link rel="icon" type="image/png" href="app_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Rubik', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #244782 0%, #1a3563 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: rgba(255,255,255,0.08);
            padding: 48px 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .logo-wrap {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            margin-bottom: 14px;
            /* fallback if no image */
            background: rgba(255,255,255,0.15);
            display: inline-block;
        }

        .logo-wrap h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .logo-wrap p {
            font-size: 14px;
            opacity: 0.7;
            font-weight: 300;
        }

        /* ── Social buttons ── */
        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 13px 20px;
            border-radius: 12px;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: 'Rubik', sans-serif;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s, transform 0.1s;
            margin-bottom: 12px;
            text-decoration: none;
        }

        .social-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.35);
        }

        .social-btn:active { transform: scale(0.98); }

        .social-btn svg { flex-shrink: 0; }

        /* Apple button — black per HIG */
        .btn-apple {
            background: #000;
            border-color: #000;
        }
        .btn-apple:hover {
            background: #1a1a1a;
            border-color: #1a1a1a;
        }

        /* Google button */
        .btn-google {
            background: white;
            border-color: white;
            color: #1a1a1a;
        }
        .btn-google:hover {
            background: #f0f0f0;
            border-color: #f0f0f0;
        }

        /* ── Divider ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 20px 0;
            opacity: 0.5;
            font-size: 13px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }

        /* ── Form fields ── */
        .field {
            margin-bottom: 14px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            opacity: 0.8;
            margin-bottom: 6px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 1.5px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: white;
            font-family: 'Rubik', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
            direction: ltr;
            text-align: right;
        }

        input::placeholder { opacity: 0.4; }

        input:focus {
            border-color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.12);
        }

        .forgot {
            text-align: left;
            margin-top: 4px;
        }

        .forgot a {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            transition: color 0.2s;
        }
        .forgot a:hover { color: white; }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: white;
            color: #244782;
            font-family: 'Rubik', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-submit:hover { opacity: 0.92; }
        .btn-submit:active { transform: scale(0.98); }

        /* ── Error message ── */
        .error-msg {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.4);
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 14px;
            display: none;
        }

        /* ── Loading spinner ── */
        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(36,71,130,0.3);
            border-top-color: #244782;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Footer links ── */
        .footer-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .footer-links a {
            font-size: 12px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: rgba(255,255,255,0.85); }

        @media (max-width: 480px) {
            .container { padding: 36px 24px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="logo-wrap">
        <img src="app_icon.png" alt="שכונה" class="logo" onerror="this.style.display='none'">
        <h1>שכונה</h1>
        <p>ניהול חשבון עסקי</p>
    </div>

    <!-- Apple -->
    <button class="social-btn btn-apple" onclick="signInWithApple()">
        <svg width="18" height="18" viewBox="0 0 814 1000" fill="white">
            <path d="M788.1 340.9c-5.8 4.5-108.2 62.2-108.2 190.5 0 148.4 130.3 200.9 134.2 202.2-.6 3.2-20.7 71.9-68.7 141.9-42.8 61.6-87.5 123.1-155.5 123.1s-85.5-39.5-164-39.5c-76 0-103.7 40.8-165.9 40.8s-105-57.8-155.5-127.4C46 389.4 45 280 45 271.2c0-5.9.1-11.8.2-17.7 1-71.7 45.3-134.5 109.6-162.8C195 74.2 232.7 65 271 65c47.3 0 82.7 16.2 121.7 16.2 32 0 78.1-16.2 127-16.2 21.8 0 96.8 2.5 139.6 59.2zm-230-79c12.8-31.7 23.8-86.7 23.8-139C581.9 48.7 572 0 571.4 0h-.6C527.3 1.7 473.7 34.6 445.9 74.9c-16.9 23.3-37.7 72.1-37.7 120.1 0 4.6.3 9.1.6 10.2.2.6 1.4.8 2.4.8 40.2 0 87-27.2 107.9-64.1z"/>
        </svg>
        המשך עם Apple
    </button>

    <!-- Google -->
    <button class="social-btn btn-google" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 48 48">
            <path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.4 30.2 0 24 0 14.6 0 6.6 5.4 2.6 13.3l7.9 6.1C12.4 13.1 17.8 9.5 24 9.5z"/>
            <path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17z"/>
            <path fill="#FBBC05" d="M10.5 28.6c-.6-1.8-.9-3.7-.9-5.6s.3-3.8.9-5.6L2.6 11.3C.9 14.8 0 18.8 0 23s.9 8.2 2.6 11.7l7.9-6.1z"/>
            <path fill="#34A853" d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2 1.4-4.6 2.2-7.7 2.2-6.2 0-11.5-4.2-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/>
        </svg>
        המשך עם Google
    </button>

    <div class="divider">או</div>

    <div class="error-msg" id="errorMsg"></div>

    <div class="field">
        <label for="email">כתובת מייל</label>
        <input type="email" id="email" placeholder="name@example.com" autocomplete="email">
    </div>

    <div class="field">
        <label for="password">סיסמה</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
        <div class="forgot"><a href="/reset-password.html">שכחתי סיסמה</a></div>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="signInWithEmail()">כניסה</button>

    <div class="footer-links">
        <a href="/">עמוד הבית</a>
        <a href="/privacy.html">פרטיות</a>
        <a href="mailto:info@shchuna.co.il">יצירת קשר</a>
    </div>

</div>

<script>
    // ── Supabase config (replace with real values) ──
    const SUPABASE_URL = 'https://mebomrqnfnbqijiuawdh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1lYm9tcnFuZm5icWlqaXVhd2RoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzkxOTc3MDEsImV4cCI6MjA1NDc3MzcwMX0.OSpzG4pnsgIiOEefWK0Z29ZHOo12bIhp0QXTdk2Hsg4';

    function showError(msg) {
        const el = document.getElementById('errorMsg');
        el.textContent = msg;
        el.style.display = 'block';
    }

    function setLoading(loading) {
        const btn = document.getElementById('submitBtn');
        btn.disabled = loading;
        btn.innerHTML = loading
            ? 'מתחבר...<span class="spinner"></span>'
            : 'כניסה';
    }

    async function signInWithEmail() {
        document.getElementById('errorMsg').style.display = 'none';
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        if (!email || !password) { showError('נא למלא מייל וסיסמה'); return; }

        setLoading(true);
        try {
            const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'apikey': SUPABASE_ANON_KEY
                },
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.access_token) {
                localStorage.setItem('sb_access_token', data.access_token);
                localStorage.setItem('sb_refresh_token', data.refresh_token);
                window.location.href = '/account.html';
            } else {
                showError('מייל או סיסמה שגויים');
            }
        } catch {
            showError('שגיאת חיבור, נסה שוב');
        }
        setLoading(false);
    }

    function signInWithApple() {
        window.location.href =
            `${SUPABASE_URL}/auth/v1/authorize?provider=apple&redirect_to=${encodeURIComponent(window.location.origin + '/account.html')}`;
    }

    function signInWithGoogle() {
        window.location.href =
            `${SUPABASE_URL}/auth/v1/authorize?provider=google&redirect_to=${encodeURIComponent(window.location.origin + '/account.html')}`;
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
        if (e.key === 'Enter') signInWithEmail();
    });
</script>
</body>
</html>
