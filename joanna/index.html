<body>
<div class="w"><img src="/app_icon.png" alt="שכונה"><p>מעבירים אותך לג'ואנה בורוס…</p><p><a href="/beit-hakerem-givat-mordechai/pros/%D7%92%D7%95%D7%90%D7%A0%D7%94-%D7%91%D7%95%D7%A8%D7%95%D7%A1/">לחצו כאן אם לא עברתם</a></p></div>
<script>
(function () {
  var CODE = "joanna";                 // ← ג'ואנה בורוס (קישור עסק → כרטיס באתר)
  var CARD = "/beit-hakerem-givat-mordechai/pros/%D7%92%D7%95%D7%90%D7%A0%D7%94-%D7%91%D7%95%D7%A8%D7%95%D7%A1/";
  var SCAN_URL = "https://mebomrqnfnbqijiuawdh.supabase.co/functions/v1/scan";
  var ua = navigator.userAgent || "";
  var isTest = /[?&]t=1/.test(location.search);
  var platform = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) ? "ios" : (/Android/i.test(ua) ? "android" : "other");
  var done = false;
  function go() { if (done) return; done = true; location.replace(CARD); }
  var px = new Image();
  px.onload = go; px.onerror = go; setTimeout(go, 1200);
  px.src = SCAN_URL + "?s=" + encodeURIComponent(CODE) + "&p=" + encodeURIComponent(platform) + (isTest ? "&t=1" : "") + "&r=" + Date.now();
})();
</script>
</body>
