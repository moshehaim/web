name: בניית עמודי SEO

# מתחילים בהרצה ידנית בלבד.
# אחרי שהפלט אושר, מסירים את ההערה מ-schedule להרצה יומית.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'   # כל שעה; commit רק אם משהו השתנה
permissions:
  contents: write

concurrency:
  group: seo-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: התקנת תלויות
        working-directory: generator
        run: npm ci || npm install

      - name: יצירת העמודים
        working-directory: generator
        run: node build.js --out ../

      - name: דחיפה אם השתנה משהו
        run: |
          git config user.name  "shchuna-bot"
          git config user.email "bot@users.noreply.github.com"
          # כל השכונות שנבנות (generator/communities.js, build: true)
          HOODS=$(node -e "import('./generator/communities.js').then(m=>console.log(m.COMMUNITIES.filter(c=>c.build).map(c=>c.slug).join(' ')))")
          git add -A -- minyanim-har-homa my-business sitemap.xml robots.txt hoods.json $HOODS
          if git diff --staged --quiet; then
            echo "אין שינויים"
          else
            git commit -m "עדכון עמודי מניינים [skip ci]"
            git push
          fi
